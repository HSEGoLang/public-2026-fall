variables:
  REGISTRY: gitlab.manytask.org:5050/hse/go/public-2026-fall

pages:
  stage: deploy
  image: golang:1.27-bookworm
  timeout: 15 minutes
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 wget ca-certificates
  script:
    - python3 tools/build_pages.py --source lectures --dest public --base-url "$CI_PAGES_URL"
  pages:
    publish: public
  rules:
    # Публикуем только из дефолтной ветки public-репозитория, не из студенческих.
    - if: '$CI_PROJECT_PATH =~ /\/public-/ && $CI_PROJECT_PATH !~ /\/students-/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

grade:
  image: $REGISTRY/testenv:latest
  script:
    - testtool grade
  timeout: 10 minutes
  rules:
    - if: '$CI_PROJECT_PATH =~ /\/students-/'
