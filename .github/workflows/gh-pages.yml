name: Publish lectures to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'lectures/**'
      - 'tools/build_pages.py'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # This workflow is copied to student repositories along with the course files.
    if: >-
      github.repository_owner == 'HSEGoLang' &&
      startsWith(github.event.repository.name, 'public-') &&
      !github.event.repository.private &&
      !github.event.repository.fork &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 wget ca-certificates

      - name: Build lectures
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 tools/build_pages.py --source lectures --dest site --base-url "$PAGES_BASE_URL"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
